name: Upstream sync

# Every week, merge the latest make-all/tuya-local release into the fork and
# open a pull request for it (.github/scripts/upstream-sync.sh). Auto-merge
# merges it with a merge commit once CI passes, then Release publishes
# X-fork.1. Unreleased upstream commits are not synced. A conflict the script
# cannot resolve on its own opens an issue instead.
#
# Needs the UPSTREAM_SYNC_TOKEN secret: a fine-grained personal access token
# for this repository with Contents, Pull requests, Issues and Workflows set
# to read and write. GITHUB_TOKEN cannot push upstream commits that change
# workflow files, and pull requests it opens start no CI.

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge the latest upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check for the token
        env:
          TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Set the UPSTREAM_SYNC_TOKEN secret (see the comment at the top of upstream-sync.yml)."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
      - name: Set the commit author
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: |
          read -r id login < <(gh api user --jq '"\(.id) \(.login)"')
          git config user.name "$login"
          git config user.email "$id+$login@users.noreply.github.com"
      - name: Sync
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
        run: bash .github/scripts/upstream-sync.sh
