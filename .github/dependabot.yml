# Weekly dependency update pull requests (GitHub Dependabot, free for public
# repositories). Python dependencies (`chore(deps)`) and workflow actions
# (`ci(deps)`) do not trigger a release. The shipped requirements in
# custom_components/tuya_local/manifest.json are not read by Dependabot.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      test-tools:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
